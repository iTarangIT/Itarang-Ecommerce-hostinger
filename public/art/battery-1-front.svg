      <stop offset="1" stop-color="#107eb1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#12181d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
