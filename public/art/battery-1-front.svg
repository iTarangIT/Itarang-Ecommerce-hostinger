<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="battery-1-front-title">
<title id="battery-1-front-title">Illustration of an iTarang battery — front view</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fa"/>
      <stop offset="1" stop-color="#e7ecef"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26363f"/>
      <stop offset="1" stop-color="#1d2a33"/>
