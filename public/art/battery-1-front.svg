      <stop offset="1" stop-color="#1d2a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#107eb1"/>
      <stop offset="1" stop-color="#0b6a94"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
