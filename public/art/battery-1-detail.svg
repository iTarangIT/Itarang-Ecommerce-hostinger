<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="battery-1-detail-title">
<title id="battery-1-detail-title">Illustration of an iTarang battery — control panel detail</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6fb"/>
      <stop offset="1" stop-color="#e4eaf4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3868"/>
      <stop offset="1" stop-color="#152a4d"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1c35"/>
      <stop offset="1" stop-color="#152a4d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#faa113"/>
      <stop offset="1" stop-color="#d1810a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#faa113" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#faa113" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f2340" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="370" r="300" fill="url(#glow)" opacity="0.35"/>
  <ellipse cx="400" cy="678" rx="230" ry="26" fill="#0f2340" opacity="0.1"/>

  <g filter="url(#soft)">
    <rect x="160" y="210" width="480" height="360" rx="28" fill="url(#body)"/>
    <circle cx="300" cy="330" r="60" fill="#0d1c35"/>
    <circle cx="300" cy="330" r="34" fill="#c1483f"/>
    <rect x="288" y="300" width="24" height="60" rx="6" fill="#fff" opacity="0.55"/>
    <rect x="270" y="318" width="60" height="24" rx="6" fill="#fff" opacity="0.55"/>
    <circle cx="500" cy="330" r="60" fill="#0d1c35"/>
    <circle cx="500" cy="330" r="34" fill="#26364d"/>
    <rect x="470" y="318" width="60" height="24" rx="6" fill="#fff" opacity="0.5"/>
    <rect x="220" y="450" width="360" height="16" rx="8" fill="#faa113" opacity="0.9"/>
    <rect x="220" y="486" width="250" height="12" rx="6" fill="#3b5c99" opacity="0.5"/>
  </g>
<text x="400" y="742" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" letter-spacing="0.6" fill="#16294a" opacity="0.5">Control panel detail</text>
</svg>