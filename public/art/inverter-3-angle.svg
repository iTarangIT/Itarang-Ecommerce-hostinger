<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="inverter-3-angle-title">
<title id="inverter-3-angle-title">Illustration of an iTarang inverter — three-quarter view</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fa"/>
